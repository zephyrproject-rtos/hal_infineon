name: Blob References

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check-blob-references:
    name: Check blob urls are Infineon hosted and commit pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Check blob references
        run: |
          python3 .github/scripts/check_blobs.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
